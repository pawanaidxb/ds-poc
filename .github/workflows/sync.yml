# Runs every time something is saved to the main branch
# (for example, when Tokens Studio pushes tokens.json from Figma).
#  1. Builds src/styles/tokens.css and design-system.md from tokens.json
#  2. Saves those two files back into the repo if they changed
#  3. Builds Storybook and publishes it as the live Storybook (gh-pages branch, site root)
# Afterwards it brings the test branch up to date with main.
# Previews of other branches are published by preview.yml under /preview/<branch>/.
name: Sync tokens and publish Storybook

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build tokens.css and design-system.md
        run: |
          node scripts/build-tokens.mjs
          node scripts/build-components-md.mjs

      - name: Save the generated files back to the repo
        run: |
          git config user.name "token-bot"
          git config user.email "token-bot@users.noreply.github.com"
          git add src/styles/tokens.css design-system.md
          if git diff --cached --quiet; then
            echo "No token changes to save."
          else
            git commit -m "Update generated tokens [skip ci]"
            git push
          fi

      - name: Install Storybook
        run: npm install --no-audit --no-fund

      - name: Build Storybook
        run: npm run build-storybook

      - name: Publish the live Storybook
        run: bash scripts/publish-pages.sh .

      - name: Bring the test branch up to date with main
        run: |
          git fetch -q origin test || { echo "No test branch yet."; exit 0; }
          git checkout -q -B test origin/test
          if git merge -q --no-edit origin/main; then
            git push -q origin test && echo "test branch now includes everything in main."
          else
            git merge --abort
            echo "::warning::test has changes that clash with main. Open the test pull request and click 'Update branch'."
          fi
