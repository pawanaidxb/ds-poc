# One-off: deletes branches that are no longer used. Only main and test are kept.
name: Remove unused branches

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-branches.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main and test
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          SOURCE=$(gh api "repos/$REPO/pages" --jq '.build_type' 2>/dev/null || echo unknown)
          echo "GitHub Pages source: $SOURCE"
          for b in $(gh api "repos/$REPO/branches" --paginate --jq '.[].name'); do
            case "$b" in
              main|test) echo "Keep $b" ;;
              gh-pages)
                if [ "$SOURCE" = "workflow" ]; then
                  gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && echo "Deleted $b"
                else
                  echo "::warning::Kept gh-pages: Pages still publishes from it. Set Settings > Pages > Source to 'GitHub Actions', then run this workflow again."
                fi ;;
              *) gh api -X DELETE "repos/$REPO/git/refs/heads/$b" && echo "Deleted $b" ;;
            esac
          done
