# Preview before going live.
# Runs when changes are saved to any branch other than main (for example a Tokens Studio
# push to a new branch, or the AI build's branch). It:
#  1. Builds tokens.css, design-system.md and Storybook from that branch (nothing is saved to main)
#  2. Publishes the Storybook to its own preview link: <pages-url>/preview/<branch>/
#  3. Opens a pull request (or comments on the existing one) with the preview link
# When the pull request is merged or closed, the preview folder is deleted.
# Merging the pull request is what updates the repo, the live Storybook and design-system.md.
name: Preview Storybook

on:
  push:
    branches-ignore: [main, gh-pages]
  pull_request:
    types: [closed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Get the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build tokens.css and design-system.md (preview only, not saved)
        run: |
          node scripts/build-tokens.mjs
          node scripts/build-components-md.mjs

      - name: Install Storybook
        run: npm install --no-audit --no-fund

      - name: Build Storybook
        run: npm run build-storybook

      - name: Publish the preview
        id: pub
        run: |
          SLUG=$(printf '%s' "$GITHUB_REF_NAME" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9._-' '-')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          bash scripts/publish-pages.sh "preview/$SLUG"
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/$SLUG/"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Preview Storybook: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "(It can take about a minute after this run for GitHub Pages to show it.)" >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request with the preview link
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.pub.outputs.url }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            printf '%s\n' \
              "**Preview Storybook:** $URL" \
              "" \
              "Nothing is live yet. Check the preview (use the Light/Dark toolbar too)." \
              "- Looks right: click **Merge pull request**. The repo, the live Storybook and design-system.md then update." \
              "- Needs changes: fix it in Figma and push to this same branch again. The preview updates." \
              "- Not wanted: click **Close pull request**. Nothing changes." > pr-body.md
            gh pr create --base main --head "$GITHUB_REF_NAME" --title "Preview: $GITHUB_REF_NAME" --body-file pr-body.md
          else
            gh pr comment "$PR" --body "Preview updated to $SHA: $URL"
          fi

  cleanup:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.head_ref }}
      cancel-in-progress: false
    steps:
      - name: Get the repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Delete the preview
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          SLUG=$(printf '%s' "$HEAD_REF" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9._-' '-')
          bash scripts/publish-pages.sh "preview/$SLUG" --remove
